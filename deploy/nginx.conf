server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = / {
    return 301 /en/;
  }

  location = /Suren_Mouchsiadis_CV.pdf {
    return 301 /cv/Suren_Mouchsiadis_CV.pdf;
  }

  location ~ ^/(en|ru|ge)/blog/(de-[^/]+)/?$ {
    return 301 /de/blog/$2/;
  }

  location ~ ^/(en|de|ge)/blog/((?!de-|index\.html/?$)[^/]+)/?$ {
    return 301 /ru/blog/$2/;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
